<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book a Trial Class | Kīpapa Grappling Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Book a trial class at Kīpapa Grappling Club in Mililani. Trial classes run Sundays 8:00 to 9:00 AM. No experience needed.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preload" href="assets/fonts/oswald-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:'Oswald';
    src:url('assets/fonts/oswald-var.woff2') format('woff2');
    font-weight:200 700;
    font-display:swap;
  }
  *{box-sizing:border-box}
  :root{
    --ink:#100E0C; --ink2:#161310; --bone:#EDE7DC; --bone-dim:#C9C1B5;
    --koa:#8B5C49; --ember:#C08A6F; --line:#2E2822; --mut:#9C948A; --mut2:#7E766B
  }
  body{margin:0; background:var(--ink); color:var(--bone); overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55}
  .cond{font-family:'Oswald','Arial Narrow',Arial,sans-serif; font-weight:700; text-transform:uppercase}
  .inner{max-width:760px; margin:0 auto; padding:0 24px}
  a{color:inherit; text-decoration:none}
  a:focus-visible{outline:2px solid var(--ember); outline-offset:3px}

  .nav{display:flex; justify-content:space-between; align-items:center; padding:16px 24px; max-width:1060px; margin:0 auto}
  .nav .mark{display:flex; align-items:center; gap:10px}
  .nav .mark img{width:46px; height:auto; filter:invert(1)}
  .nav .mark span{font-size:12px; letter-spacing:.22em; font-weight:700}
  .nav .back{font-size:12.5px; color:var(--mut)}
  .nav .back:hover{color:var(--bone)}

  .label{display:inline-block; font-family:'Oswald',Arial,sans-serif; font-weight:600; text-transform:uppercase; font-size:13px; letter-spacing:.18em; color:#F5EFE6; background:var(--koa); padding:6px 14px; transform:skewX(-8deg); margin:0 0 18px}
  .label b{display:inline-block; transform:skewX(8deg); font-weight:600}
  .h1{font-size:clamp(36px,8vw,64px); line-height:.94; margin:0 0 14px; text-wrap:balance}
  p.body{color:var(--bone-dim); font-size:15.5px; max-width:56ch; margin:0 0 10px}
  .micro{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:11.5px; color:var(--mut2); margin:0 0 28px}

  .head{padding:44px 0 0}
  .formwrap{border:1px solid var(--line); background:var(--ink2); padding:10px; margin:0 0 56px}
  .gymdesk-frame-container iframe{width:100%}

  .foot{padding:0 0 44px; color:var(--mut2); font-size:13px}
  .foot a:hover{color:var(--bone)}
</style>
</head>
<body>

<nav class="nav" aria-label="Main">
  <a class="mark" href="index.html">
    <img src="assets/logo.png" alt="Kīpapa Grappling Club logo">
  </a>
  <a class="back" href="index.html">&larr; Back to the site</a>
</nav>

<header class="head">
  <div class="inner">
    <p class="label"><b>Free trial</b></p>
    <h1 class="h1 cond">Get on the mats.</h1>
    <p class="body">Trial classes run Sundays, 8:00 to 9:00 AM. No experience needed. Fill this out and you're booked.</p>
    <p class="micro">DOORS OPEN AUGUST 3 · 233 AKAMAINUI STREET UNIT 27, MILILANI</p>
  </div>
</header>

<main class="inner">
  <div class="formwrap">
    <div class="maonrails-form" attr-ref="lOjpB" attr-gym="lQvZ5"></div>
  </div>
</main>

<footer class="foot">
  <div class="inner">
    <p>Questions first? <a href="mailto:info@kipapagrapplingclub.com">info@kipapagrapplingclub.com</a> · <a href="https://instagram.com/kipapagrapplingclub" rel="noopener">@kipapagrapplingclub</a></p>
  </div>
</footer>

<script src="https://app.gymdesk.com/js/widgets.js"></script>
</body>
</html>
